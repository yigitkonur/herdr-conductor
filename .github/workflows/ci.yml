name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  manifests:   # kit:manifests:start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Install Claude Code CLI (for plugin validate)
        run: npm install -g @anthropic-ai/claude-code
      - name: Manifests, versions, install policy, kit copies, rendered blocks
        run: python3 scripts/kit/check-manifests.py --validate
      - name: Secret scan (tree and history)
        run: python3 scripts/kit/secret-scan.py --tree --history
      - name: Local markdown links
        run: python3 scripts/kit/check-links.py
  # kit:manifests:end
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Guard hook cases (synthetic, nothing runs herdr)
        run: python3 -I tests/guard_check.py
      - name: Docs lint (needs the herdr CLI to compare commands and flags)
        run: |
          if command -v herdr >/dev/null 2>&1; then python3 -I tools/lint.py
          else echo "herdr is not installed on this runner: tools/lint.py skipped (run it locally before pushing)"; fi
